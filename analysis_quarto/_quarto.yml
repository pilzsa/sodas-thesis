project:
  type: website
  resources:
    - particlesjs-config.json
    # The map fetches its data at run time, so these files must ship beside the
    # page: embed-resources only inlines what the HTML refers to statically.
    - assets/map
  pre-render:
    - python3 facility_map_data.py
  output-dir: docs

website:
  title: "EU Toxic Burden Atlas"
  navbar:
    left:
      - href: index.qmd
        text: Map & Analysis
      - href: about.qmd
        text: Methodology

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true



